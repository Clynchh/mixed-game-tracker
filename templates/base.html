<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Mixed Game Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <div class="brand"><a href="/" style="color:inherit;text-decoration:none">Mix<span>Track</span></a></div>
    <nav class="top-nav">
      <a href="/">Dashboard</a>
      <a href="/reports">Reports</a>
    </nav>
    <div class="meta">
      {% block header_meta %}{% endblock %}
      <a href="/settings" class="btn-ghost btn" style="padding:5px 12px;">Settings</a>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    function toggleQuickTag(handId, tag, isActive, event) {
      event.stopPropagation();
      const action = isActive ? 'untag' : 'tag';
      const body = new URLSearchParams({tag: tag});
      fetch(`/hand/${handId}/${action}`, {method: 'POST', body: body})
        .then(() => location.reload());
    }
  </script>
</body>
</html>
